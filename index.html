<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수업 자료</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#F6F5F1;
    --surface:#FFFFFF;
    --ink:#1E1E1C;
    --ink-soft:#767469;
    --accent:#2B5D5A;
    --accent-soft:#E4ECEA;
    --border:#E4E1D6;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--bg);
    color:var(--ink);
    font-family:'Pretendard', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:720px;
    margin:0 auto;
    min-height:100%;
    display:flex;
    flex-direction:column;
  }
  header{
    padding:36px 24px 20px;
  }
  header h1{
    font-size:22px;
    font-weight:700;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  header p{
    margin:0;
    font-size:14px;
    color:var(--ink-soft);
  }
  main{
    flex:1;
    padding:0 24px 60px;
  }
  .date-group{
    margin-bottom:28px;
  }
  .date-label{
    font-size:13px;
    font-weight:600;
    color:var(--accent);
    margin:0 0 10px;
    padding-bottom:8px;
    border-bottom:1px solid var(--border);
  }
  .item-list{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .item-btn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    width:100%;
    text-align:left;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 16px;
    font-family:inherit;
    font-size:15px;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .15s ease;
  }
  .item-btn:hover, .item-btn:focus-visible{
    border-color:var(--accent);
    outline:none;
  }
  .item-tag{
    flex-shrink:0;
    font-size:11px;
    font-weight:600;
    color:var(--accent);
    background:var(--accent-soft);
    padding:3px 8px;
    border-radius:100px;
  }
  .empty-state{
    margin-top:60px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    line-height:1.6;
  }
  .error-state{
    margin-top:60px;
    text-align:center;
    color:#B3453D;
    font-size:14px;
    line-height:1.6;
  }

  /* 전체화면 미리보기 */
  #previewView{
    position:fixed;
    inset:0;
    background:var(--surface);
    display:none;
    flex-direction:column;
    z-index:100;
  }
  #previewView.open{
    display:flex;
  }
  .preview-bar{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .back-btn{
    display:flex;
    align-items:center;
    gap:6px;
    background:none;
    border:none;
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    color:var(--accent);
    cursor:pointer;
    padding:8px 10px;
    margin:-8px -10px;
    border-radius:8px;
  }
  .back-btn:hover{
    background:var(--accent-soft);
  }
  .preview-title{
    font-size:15px;
    font-weight:600;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  #previewFrame{
    flex:1;
    width:100%;
    border:none;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>수업 자료</h1>
    <p>날짜별로 정리된 자료를 확인하세요.</p>
  </header>
  <main id="listArea">
    <div class="empty-state">불러오는 중...</div>
  </main>
</div>

<div id="previewView">
  <div class="preview-bar">
    <button class="back-btn" id="backBtn">&larr; 목록으로</button>
    <div class="preview-title" id="previewTitle"></div>
  </div>
  <iframe id="previewFrame"></iframe>
</div>

<script>
const listArea = document.getElementById('listArea');
const previewView = document.getElementById('previewView');
const previewFrame = document.getElementById('previewFrame');
const previewTitle = document.getElementById('previewTitle');
const backBtn = document.getElementById('backBtn');

function formatDateLabel(isoDate){
  const d = new Date(isoDate);
  if(isNaN(d)) return isoDate;
  const days = ['일','월','화','수','목','금','토'];
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
}

function groupByDate(items){
  const groups = {};
  items.forEach(item => {
    const dayKey = (item.date || '').split('T')[0];
    if(!groups[dayKey]) groups[dayKey] = [];
    groups[dayKey].push(item);
  });
  return Object.entries(groups)
    .sort((a,b) => b[0].localeCompare(a[0]))
    .map(([day, items]) => ({
      day,
      items: items.sort((a,b) => (b.date||'').localeCompare(a.date||''))
    }));
}

function render(items){
  if(!items.length){
    listArea.innerHTML = '<div class="empty-state">아직 등록된 자료가 없습니다.</div>';
    return;
  }
  const groups = groupByDate(items);
  listArea.innerHTML = groups.map(group => `
    <div class="date-group">
      <div class="date-label">${formatDateLabel(group.day)}</div>
      <div class="item-list">
        ${group.items.map(item => `
          <button class="item-btn" data-filename="${encodeURIComponent(item.filename)}" data-type="${item.type}" data-title="${encodeURIComponent(item.title)}">
            <span>${item.title}</span>
            <span class="item-tag">${item.type === 'pdf' ? 'PDF' : 'HTML'}</span>
          </button>
        `).join('')}
      </div>
    </div>
  `).join('');

  listArea.querySelectorAll('.item-btn').forEach(btn => {
    btn.addEventListener('click', () => openPreview(
      decodeURIComponent(btn.dataset.filename),
      decodeURIComponent(btn.dataset.title),
      btn.dataset.type
    ));
  });
}

function openPreview(filename, title, type){
  previewTitle.textContent = title;
  previewFrame.removeAttribute('sandbox');
  if(type === 'html'){
    previewFrame.setAttribute('sandbox', 'allow-scripts allow-forms allow-popups allow-modals');
  }
  previewFrame.src = `materials/${filename}`;
  previewView.classList.add('open');
}

backBtn.addEventListener('click', () => {
  previewView.classList.remove('open');
  previewFrame.src = 'about:blank';
});

fetch(`materials/index.json?t=${Date.now()}`)
  .then(res => {
    if(!res.ok) throw new Error('not found');
    return res.json();
  })
  .then(render)
  .catch(() => {
    listArea.innerHTML = '<div class="empty-state">아직 등록된 자료가 없습니다.</div>';
  });
</script>
</body>
</html>
